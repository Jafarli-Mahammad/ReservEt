    // --- HELPER COMPONENT: DRAG AND DROP FILE UPLOAD ---
    function DragDropUpload({ label, value, onChange, presetIcon }) {
      const [dragging, setDragging] = React.useState(false);

      const handleDrag = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.type === "dragenter" || e.type === "dragover") {
          setDragging(true);
        } else if (e.type === "dragleave") {
          setDragging(false);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setDragging(false);
        
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          const file = e.dataTransfer.files[0];
          const reader = new FileReader();
          reader.onload = (event) => {
            onChange(event.target.result); // base64 representation
          };
          reader.readAsDataURL(file);
        }
      };

      const handleFileChange = (e) => {
        if (e.target.files && e.target.files[0]) {
          const file = e.target.files[0];
          const reader = new FileReader();
          reader.onload = (event) => {
            onChange(event.target.result);
          };
          reader.readAsDataURL(file);
        }
      };

      return (
        <div
          onDragEnter={handleDrag}
          onDragOver={handleDrag}
          onDragLeave={handleDrag}
          onDrop={handleDrop}
          className={`border-2 border-dashed rounded-xl p-4 flex flex-col items-center justify-center cursor-pointer transition-all ${
            dragging ? "border-violet-500 bg-violet-600/10" : "border-purple-900/40 bg-[#161327] hover:border-purple-800"
          }`}
        >
          {value ? (
            <div className="relative w-full h-24 flex items-center justify-center rounded-lg overflow-hidden">
              <img src={value} className="h-full w-auto object-cover rounded" />
              <button
                type="button"
                onClick={(e) => {
                  e.stopPropagation();
                  onChange("");
                }}
                className="absolute top-1 right-1 p-1 bg-rose-600 hover:bg-rose-500 rounded-full text-white text-[10px] w-5 h-5 flex items-center justify-center font-bold"
              >
                ✕
              </button>
            </div>
          ) : (
            <label className="w-full text-center cursor-pointer flex flex-col items-center justify-center">
              <span className="text-2xl mb-1">{presetIcon || "📸"}</span>
              <span className="text-xs text-gray-200 font-bold block">{label}</span>
              <span className="text-[10px] text-gray-500 block mt-0.5">Sürüşürün & buraxın və ya seçmək üçün klikləyin</span>
              <input
                type="file"
                accept="image/*"
                onChange={handleFileChange}
                className="hidden"
              />
            </label>
          )}
        </div>
      );
    }

    // --- HELPER COMPONENT: LEAFLET MAP WIDGET ---
    function MapWidget({ latitude, longitude, onChangeCoords, isEditable }) {
      const mapContainerRef = React.useRef(null);
      const mapInstanceRef = React.useRef(null);
      const markerInstanceRef = React.useRef(null);

      React.useEffect(() => {
        if (!mapContainerRef.current) return;

        // Initialize map
        const map = L.map(mapContainerRef.current).setView([latitude, longitude], 13);
        mapInstanceRef.current = map;

        // Dark Matter map tiles for Rezerv.az dark violet theme
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        // Marker
        const marker = L.marker([latitude, longitude], {
          draggable: isEditable
        }).addTo(map);
        markerInstanceRef.current = marker;

        if (isEditable) {
          marker.on('dragend', () => {
            const position = marker.getLatLng();
            onChangeCoords(position.lat, position.lng);
          });

          map.on('click', (e) => {
            const { lat, lng } = e.latlng;
            marker.setLatLng([lat, lng]);
            onChangeCoords(lat, lng);
          });
        }

        return () => {
          if (mapInstanceRef.current) {
            const currentMap = mapInstanceRef.current;
            mapInstanceRef.current = null;
            setTimeout(() => {
              try {
                currentMap.remove();
              } catch (e) {
                console.warn("Leaflet cleanup warning:", e);
              }
            }, 0);
          }
        };
      }, [isEditable]);

      React.useEffect(() => {
        if (mapInstanceRef.current && markerInstanceRef.current) {
          markerInstanceRef.current.setLatLng([latitude, longitude]);
          mapInstanceRef.current.panTo([latitude, longitude]);
        }
      }, [latitude, longitude]);

      return (
        <div className="relative w-full h-[220px] rounded-xl overflow-hidden border border-purple-900/40">
          <div ref={mapContainerRef} className="w-full h-full" style={{ zIndex: 10 }} />
          {isEditable && (
            <div className="absolute bottom-2 right-2 z-[999] bg-[#161327]/90 backdrop-blur-md px-2.5 py-1 rounded-lg text-[10px] font-bold text-violet-300 border border-purple-800/40 pointer-events-none">
              📌 Xəritədə klikləyərək və ya pini sürüşdürərək mövqe təyin edin
            </div>
          )}
        </div>
      );
    }

    // --- 2. PUBLIC BOOKING PAGE ---
    function PublicBookingPage({ pro, onBack, bookings, setBookings, customers, setCustomers, waitlist, setWaitlist, triggerToast, triggerTelegramBotNotice }) {
      const [selectedService, setSelectedService] = useState(pro.services[0]);
      const [selectedDate, setSelectedDate] = useState('2026-07-24');
      const [selectedTime, setSelectedTime] = useState('11:00');
      
      const [showModal, setShowModal] = useState(false);
      const [selectedAvatar, setSelectedAvatar] = useState('👑');
      const [customerForm, setCustomerForm] = useState({
        name: '', phone: '', email: '', telegram: '', notes: '', paymentMethod: 'cash'
      });

      const proBookingsToday = useMemo(() => {
        return bookings.filter(b => b.professionalId === pro.id && b.date === selectedDate);
      }, [bookings, pro.id, selectedDate]);

      const isDateBlocked = useMemo(() => {
        return pro.blockedDates && pro.blockedDates.includes(selectedDate);
      }, [pro.blockedDates, selectedDate]);

      const baseSlots = ['09:30', '10:00', '10:30', '11:00', '11:30', '14:00', '14:30', '15:00', '15:30', '16:00'];

      const calculatedSlots = useMemo(() => {
        return baseSlots.map(t => {
          if (isDateBlocked) {
            return { time: t, status: 'blocked', bookedBy: 'İstirahət günü' };
          }
          if (pro.blockedHours && pro.blockedHours.includes(t)) {
            return { time: t, status: 'blocked', bookedBy: 'Dondurulub' };
          }
          if (pro.blockedHoursByDate && pro.blockedHoursByDate[selectedDate] && pro.blockedHoursByDate[selectedDate].includes(t)) {
            return { time: t, status: 'blocked', bookedBy: 'Dondurulub' };
          }
          const match = proBookingsToday.find(b => b.time === t);
          if (match) {
            return {
              time: t,
              status: 'booked',
              bookedBy: match.customerName,
              avatar: match.customerAvatar || '👤'
            };
          }
          return { time: t, status: 'available' };
        });
      }, [proBookingsToday, isDateBlocked, pro.blockedHours, pro.blockedHoursByDate, selectedDate]);

      const googleMapsDirUrl = `https://www.google.com/maps/dir/?api=1&destination=${pro.latitude},${pro.longitude}`;
      const wazeDirUrl = `https://waze.com/ul?ll=${pro.latitude},${pro.longitude}&navigate=yes`;

      const handleConfirmBooking = (e) => {
        e.preventDefault();

        const isClientBlacklisted = customers.some(
          c => c.isBlacklisted && 
          (c.phone.replace(/\s+/g, '') === customerForm.phone.replace(/\s+/g, '') ||
           c.name.toLowerCase() === customerForm.name.toLowerCase())
        );

        if (isClientBlacklisted) {
          triggerToast("Təəssüf ki, rezervasiyanız qəbul edilmədi (Müştəri bloklanıb).", "error");
          return;
        }

        const newBooking = {
          id: `b-${Date.now()}`,
          professionalId: pro.id,
          serviceName: selectedService.name,
          price: selectedService.price,
          date: selectedDate,
          time: selectedTime,
          customerName: customerForm.name || 'Müştəri',
          customerAvatar: selectedAvatar,
          customerPhone: customerForm.phone,
          customerEmail: customerForm.email,
          customerTelegram: customerForm.telegram,
          notes: customerForm.notes,
          paymentMethod: customerForm.paymentMethod,
          status: 'pending'
        };

        setBookings([newBooking, ...bookings]);

        const telegramPayload = {
          chatId: pro.telegramChatId || '123456789',
          text: `🔔 YENİ RANDEVU REZERVA EDİLDİ!\n\n` +
                `👤 Müştəri: ${selectedAvatar} ${customerForm.name || 'Müştəri'}\n` +
                `📞 Telefon: ${customerForm.phone}\n` +
                `📧 E-poçt: ${customerForm.email || 'Qeyd olunmayıb'}\n` +
                `✂️ Xidmət: ${selectedService.name} (${selectedService.price} AZN)\n` +
                `📅 Tarix: ${selectedDate} saat ${selectedTime}\n` +
                `💳 Ödəniş: ${customerForm.paymentMethod === 'cash' ? 'Nağd (Qəbulda)' : 'Onlayn Kart'}\n` +
                `📝 Qeyd: ${customerForm.notes || 'Yoxdur'}\n` +
                `📍 Ünvan: ${pro.workingAddress}\n\n` +
                `🗺 Google Maps: ${googleMapsDirUrl}\n` +
                `🚗 Waze Naviqasiya: ${wazeDirUrl}`
        };

        const customerPayload = {
          recipient: customerForm.phone,
          email: customerForm.email || 'Qeyd olunmayıb',
          text: `✉️ SMS & E-POÇT BİLDİRİŞİ (Müştəriyə)\n\n` +
                `Hörmətli ${selectedAvatar} ${customerForm.name || 'Müştəri'},\n` +
                `Randevunuz UĞURLA REZERV EDİLDİ!\n\n` +
                `👤 Mütəxəssis: ${pro.fullName} (${pro.businessName})\n` +
                `✂️ Xidmət: ${selectedService.name} (${selectedService.price} AZN)\n` +
                `📅 Tarix: ${selectedDate} saat ${selectedTime}\n` +
                `📍 Ünvan: ${pro.workingAddress}\n\n` +
                `Randevu haqqında SMS bildirişi ${customerForm.phone} nömrəsinə göndərildi.`
        };

        setShowModal(false);
        triggerToast(`${selectedAvatar} ${customerForm.name} - randevunuz təsdiqləndi!`);
        triggerTelegramBotNotice({
          specialist: telegramPayload,
          customer: customerPayload
        });
      };

      return (

        triggerToast(newBlocked.includes(date) ? `${date} istirahət günü təyin edildi!` : `${date} yenidən iş günü edildi!`);
      };

      const handleToggleBlockHour = (date, hour) => {
        let currentBlocked = { ...(pro.blockedHoursByDate || {}) };
        let hoursForDate = [...(currentBlocked[date] || [])];
        if (hoursForDate.includes(hour)) {
          hoursForDate = hoursForDate.filter(h => h !== hour);
        } else {
          hoursForDate.push(hour);
        }
        currentBlocked[date] = hoursForDate;
        setPro({ ...pro, blockedHoursByDate: currentBlocked });
        triggerToast(`${hour} saatı donduruldu/aktivləşdirildi!`);
      };

      const handleDragDropBooking = (e, newTime) => {
        e.preventDefault();
        const bookingId = e.dataTransfer.getData('text/plain');
        if (!bookingId) return;

        const isBooked = bookings.some(b => b.professionalId === pro.id && b.date === selectedScheduleDate && b.time === newTime);

                              onClick={() => {
                                const updated = customers.map(cust => 
                                  cust.id === c.id ? { ...cust, isBlacklisted: !isBlocked } : cust

                                setCustomers(updated);
                                triggerToast(isBlocked ? `${c.name} blokdan çıxarıldı.` : `${c.name} qara siyahıya salındı!`, isBlocked ? 'success' : 'warning');

                                  : 'bg-slate-900/60 border-purple-900/40 text-gray-400 hover:text-white'
                              }`}
                            >

                      );
                    })}

                </table>
